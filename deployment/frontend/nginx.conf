# Frontend Nginx (nginx-unprivileged: non-root, listens on 8080 inside the container).
# The host Nginx terminates TLS and forwards to 127.0.0.1:8081. Only /api goes to the backend container,
# over the private Docker network. The backend port is never published.
#
# The container root filesystem is read-only. Every path nginx writes to is under /tmp, which is a tmpfs
# (see docker-compose.yml).

# Forward the protocol set by the host Nginx; fall back to this hop's scheme when it is absent.
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# Temporary files: client_body_temp_path and proxy_temp_path are NOT set here. The base image's /etc/nginx/nginx.conf
# already sets them in the http block (/tmp/client_temp and /tmp/proxy_temp), and this file is included inside
# that block, so a second definition is rejected as a duplicate. Both base paths are under /tmp (tmpfs).

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Basic security headers. Applied to every response from this server, including /api responses.
    # CSP and HSTS are deliberately NOT set here yet (HSTS belongs with the host's TLS configuration).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root  /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving at request time means Nginx starts even if the backend is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Container health: serves the static index page. Does not depend on the backend.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;

        # The backend sends its own X-Content-Type-Options and X-Frame-Options (Spring Security). Hide them here so
        # the browser does not receive a duplicate copy from this hop. The values set above still apply.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # Overwrite on the host Nginx (see README.md). This hop appends its peer address to whatever arrives.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    # Single-page application: unknown paths return index.html so client-side routes work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
